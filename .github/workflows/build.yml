name: build-image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boş alan aç (imaj ~7GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha-<commit> etiketi DEĞİŞMEZ — üretim RunPod'da digest ile sabit
          # (bkz. URETIM.md). latest yalnız 'son derleme' demek, canlı DEĞİL.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            MODELS_URL=https://v3b.fal.media/files/b/0aa6c117/sYl8_WxWYdyxeCxGJzNhs_ff_models.tar
